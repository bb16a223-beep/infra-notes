
services:
  flask:
    build: .
    env_file: .env
    depends_on:
       - db
  nginx:
    image: nginx:stable
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - flask
  db:
    image: postgres:16
    env_file: .env
    volumes:
        - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

