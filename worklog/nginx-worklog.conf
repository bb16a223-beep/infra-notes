# /etc/nginx/sites-available/default の server { ... } の中に追記する
# （location / { ... } と同じ階層。セミコロンと波カッコに注意）

	location /worklog/ {
		# 自分の PC からだけ使えるようにする
		allow 127.0.0.1;
		allow ::1;
		deny all;

		# 末尾の / で「/worklog/」を取り除いて転送する
		proxy_pass http://127.0.0.1:8090/;
		proxy_set_header Host $host;
	}
